<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Marketing Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f0;color:#1a1a18;min-height:100vh}
:root{--c1:#7F77DD;--c1l:#EEEDFE;--c1d:#3C3489;--c2:#1D9E75;--c2l:#E1F5EE;--c2d:#085041;--cal:#FAEEDA;--border:#e2e0d8;--card:#fff;--surface:#f1efe8;--muted:#888780;--danger:#E24B4A;--dangerl:#FCEBEB;--star:#BA7517;--starl:#FAEEDA}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--card);border-right:0.5px solid var(--border);padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:1.5rem;overflow-y:auto}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.top-bar-left{display:flex;align-items:center;gap:4px;flex:1}
.week-badge{display:flex;align-items:center;gap:8px;background:var(--c1l);border-radius:8px;padding:6px 14px}
.week-badge span{font-size:13px;font-weight:500;color:var(--c1d)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:0.5px solid var(--border);background:var(--card);color:#1a1a18;font-size:13px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--surface)}
.btn-primary{background:var(--c1);color:#fff;border-color:var(--c1)}
.btn-primary:hover{background:var(--c1d)}
.btn-new-week{background:var(--c1l);color:var(--c1d);border-color:var(--c1l);font-size:12px;padding:5px 10px}
.btn-new-week:hover{background:#dddcfc}
.search-box{position:relative}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.search-box input{width:100%;padding:8px 10px 8px 34px;border:0.5px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:#1a1a18;outline:none}
.search-box input:focus{border-color:var(--c1)}
.sidebar-section{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:.5rem}
.song-link{font-size:12px;padding:3px 8px;color:var(--muted);cursor:pointer;border-radius:6px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.song-link:hover{background:var(--surface);color:#1a1a18}
.song-link-artist{font-weight:500;color:#1a1a18}
.song-link-sep{color:var(--border);margin:0 4px}
.song-card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;margin-bottom:1rem;overflow:hidden}
.song-card-header{padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;cursor:pointer;user-select:none}
.song-card-header:hover{background:#fafaf8}
.song-title-area{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.song-avatar{width:42px;height:42px;border-radius:8px;background:var(--c1l);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.song-meta{min-width:0}
.song-name{font-size:15px;font-weight:500}
.song-artist{font-size:12px;color:var(--muted);margin-top:1px;display:flex;align-items:center;gap:8px}
.song-card-body{padding:1.25rem;display:flex;flex-direction:column;gap:1.25rem;border-top:0.5px solid var(--border)}
.section-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.trend-box{background:var(--surface);border-radius:8px;padding:.75rem 1rem;font-size:13px;line-height:1.6}
.trend-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:.5rem}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500}
.tag-week{background:var(--c2l);color:var(--c2d)}
.tag-trend{background:var(--cal);color:#633806}
.data-section{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
@media(max-width:700px){.data-section{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}}
.stats-row{display:flex;gap:6px;margin-bottom:.75rem}
.stat-pill{background:var(--surface);border-radius:8px;padding:.5rem .75rem;flex:1;text-align:center}
.stat-pill-val{font-size:15px;font-weight:500}
.stat-pill-label{font-size:10px;color:var(--muted);margin-top:1px}
.tiktok-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:.75rem}
.tik-stat{background:var(--surface);border-radius:8px;padding:.5rem .75rem;display:flex;align-items:center;gap:8px}
.tik-stat-icon{font-size:14px;color:#ff0050}
.tik-stat-val{font-size:14px;font-weight:500;color:#ff0050}
.tik-stat-label{font-size:10px;color:var(--muted)}
.tik-stat-main{background:var(--surface);border-radius:8px;padding:.5rem .75rem;display:flex;align-items:center;gap:8px;grid-column:1/-1}
.chart-wrap{background:var(--surface);border-radius:8px;padding:.75rem}
.stat-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.spotify-dot{background:#1DB954}
.tiktok-dot{background:#ff0050}
.videos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:.5rem}
.video-thumb{border-radius:8px;overflow:hidden;border:0.5px solid var(--border);aspect-ratio:9/16;background:var(--surface);position:relative}
.video-thumb iframe{width:100%;height:100%;border:none}
.video-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.08);opacity:0;transition:opacity .2s}
.video-thumb:hover .video-overlay{opacity:1}
.video-overlay i{font-size:28px;color:#fff}
.week-accordion{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-top:.5rem}
.week-accordion-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1rem;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);user-select:none}
.week-accordion-header:hover{background:#e8e6df}
.week-accordion-header .chevron{transition:transform .2s;font-size:14px}
.week-accordion-header.open .chevron{transform:rotate(180deg)}
.week-accordion-body{display:none;padding:.75rem 1rem;border-top:0.5px solid var(--border)}
.week-accordion-body.open{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--card);border-radius:12px;padding:1.5rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border:0.5px solid var(--border)}
.modal h2{font-size:16px;font-weight:500;margin-bottom:1rem}
.modal-song-ref{background:var(--c1l);border-radius:8px;padding:.6rem 1rem;margin-bottom:1rem;font-size:13px;color:var(--c1d);font-weight:500}
.field{margin-bottom:1rem}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.field input,.field textarea{width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:#1a1a18;font-family:inherit;outline:none;resize:vertical}
.field input[type=file]{padding:6px 10px;cursor:pointer}
.field input[type=date]{cursor:pointer}
.field input:focus,.field textarea:focus{border-color:var(--c1)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}
.url-list{display:flex;flex-direction:column;gap:6px}
.url-row{display:flex;gap:6px;align-items:center}
.url-row input{flex:1}
.url-row button{flex-shrink:0;width:30px;height:30px;border:0.5px solid var(--border);border-radius:6px;background:var(--dangerl);color:var(--danger);cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-url{margin-top:6px;font-size:12px;color:var(--c1);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.csv-status{font-size:11px;color:var(--c2d);background:var(--c2l);border-radius:6px;padding:3px 8px;margin-top:4px;display:none}
.week-auto{font-size:11px;color:var(--c1d);background:var(--c1l);border-radius:6px;padding:3px 8px;margin-top:4px}
.hidden{display:none}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty i{font-size:40px;margin-bottom:.75rem;display:block}
.no-data{background:var(--surface);border-radius:8px;padding:1rem;font-size:12px;color:var(--muted);text-align:center}
.history-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem}
.history-filters select{padding:7px 10px;border:0.5px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;color:#1a1a18;outline:none}
.history-row{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:.5rem;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.history-week-dot{width:32px;height:32px;border-radius:50%;background:var(--c1l);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--c1d);flex-shrink:0}
.history-meta{font-size:12px;color:var(--muted);margin-top:2px}
.history-trend{font-size:12px;color:var(--muted);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:0.5px solid transparent;color:var(--muted)}
.nav-tab.active{background:var(--card);border-color:var(--border);color:#1a1a18;font-weight:500}
.star-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:18px;line-height:1;transition:transform .15s;display:inline-flex;align-items:center;justify-content:center}
.star-btn:hover{transform:scale(1.2)}
.star-btn .ti{font-size:18px;color:var(--muted);transition:color .15s}
.star-btn.fav .ti{color:var(--star)}
.favs-empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.favs-empty i{font-size:40px;margin-bottom:.75rem;display:block}
.fav-card{background:var(--card);border:0.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:.5rem;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.fav-avatar{width:36px;height:36px;border-radius:8px;background:var(--c1l);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden}
.fav-remove{background:none;border:none;cursor:pointer;color:var(--star);font-size:18px;padding:4px;border-radius:6px;display:flex;align-items:center}
.fav-remove:hover{background:var(--starl)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div>
      <div style="font-size:15px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:8px">
        <i class="ti ti-music" style="color:var(--c1)"></i> Music Trends
      </div>
      <div class="search-box">
        <i class="ti ti-search"></i>
        <input type="text" id="sidebarSearch" placeholder="Buscar artista o canción..." oninput="renderSidebar()">
      </div>
    </div>
    <div>
      <div class="sidebar-section">Artistas & canciones</div>
      <div id="artistTree"></div>
    </div>
    <div style="margin-top:auto;padding-top:1rem;border-top:0.5px solid var(--border)">
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="showAddModal()"><i class="ti ti-plus"></i> Nueva canción</button>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="nav-tabs">
          <div class="nav-tab active" onclick="switchView('weekly',this)"><i class="ti ti-calendar-week"></i> Semana actual</div>
          <div class="nav-tab" onclick="switchView('history',this)"><i class="ti ti-history"></i> Histórico</div>
        </div>
        <div class="nav-tabs" style="margin-left:auto">
          <div class="nav-tab" onclick="switchView('favorites',this)"><i class="ti ti-star"></i> Favoritos</div>
        </div>
      </div>
      <div class="week-badge">
        <i class="ti ti-calendar" style="font-size:14px;color:var(--c1d)"></i>
        <span id="weekLabel"></span>
      </div>
    </div>

    <div id="weeklyView">
      <div id="songCards"></div>
      <div id="emptyState" class="empty hidden">
        <i class="ti ti-music-off"></i>
        <p>No hay canciones esta semana.</p>
        <button class="btn btn-primary" style="margin:1rem auto 0;display:inline-flex" onclick="showAddModal()"><i class="ti ti-plus"></i> Nueva canción</button>
      </div>
    </div>

    <div id="historyView" class="hidden">
      <div class="history-filters">
        <div class="search-box" style="flex:1;min-width:200px">
          <i class="ti ti-search"></i>
          <input type="text" id="histSearch" placeholder="Buscar en todo el histórico..." oninput="renderHistory()">
        </div>
        <select id="filterArtist" onchange="renderHistory()"><option value="">Todos los artistas</option></select>
        <select id="filterWeek" onchange="renderHistory()"><option value="">Todas las semanas</option></select>
      </div>
      <div id="historyContent"></div>
    </div>

    <div id="favoritesView" class="hidden">
      <div id="favoritesContent"></div>
    </div>
  </main>
</div>

<!-- MODAL: Nueva canción -->
<div id="modalBg" class="modal-bg hidden" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2>Nueva canción</h2>
    <div class="field-row">
      <div class="field"><label>Artista</label><input type="text" id="fArtist" placeholder="Cano"></div>
      <div class="field"><label>Canción</label><input type="text" id="fSong" placeholder="Así Nací y Así Moriré"></div>
    </div>
    <div class="field"><label>Link de insights (opcional)</label><input type="text" id="fInsights" placeholder="https://insights.sonymusic.com/..."></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modalBg')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSong()"><i class="ti ti-check"></i> Crear canción</button>
    </div>
  </div>
</div>

<!-- MODAL: Nueva semana / Editar semana -->
<div id="weekModalBg" class="modal-bg hidden" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="weekModalTitle">Nueva semana</h2>
    <div class="modal-song-ref" id="weekModalSongRef"></div>
    <div class="field">
      <label>Fecha del informe</label>
      <input type="date" id="wDate" onchange="autoWeek(this.value,'wWeek','wWeekLabel2')">
      <div class="week-auto" id="wWeekLabel2">Selecciona una fecha para calcular la semana</div>
      <input type="hidden" id="wWeek">
    </div>
    <div class="field"><label>Tendencia (descripción)</label><textarea id="wTrend" rows="3" placeholder="Fotos con tu pareja con la letra..."></textarea></div>
    <div class="field"><label>Etiquetas de tendencia (separadas por comas)</label><input type="text" id="wTags" placeholder="carrusel fotos, ugc, pareja, romántico"></div>
    <div class="field">
      <label>CSV Spotify (streams diarios — siempre últimos 28 días)</label>
      <input type="file" id="wSpotifyCSV" accept=".csv" onchange="handleSpotifyCSV(this)">
      <div class="csv-status" id="wSpotifyCSVStatus"></div>
    </div>
    <div class="field">
      <label>CSV TikTok (creaciones)</label>
      <input type="file" id="wTikTokCSV" accept=".csv" onchange="handleTikTokCSV(this)">
      <div class="csv-status" id="wTikTokCSVStatus"></div>
    </div>
    <div class="field">
      <label>Vídeos de TikTok (URLs)</label>
      <div class="url-list" id="wUrlList"></div>
      <div class="add-url" onclick="addUrlField('wUrlList')"><i class="ti ti-plus" style="font-size:13px"></i> Añadir vídeo</div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('weekModalBg')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveWeek()"><i class="ti ti-check"></i> Guardar semana</button>
    </div>
  </div>
</div>

<!-- MODAL: Editar canción base -->
<div id="editSongModalBg" class="modal-bg hidden" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2>Editar canción</h2>
    <div class="field-row">
      <div class="field"><label>Artista</label><input type="text" id="eSArtist"></div>
      <div class="field"><label>Canción</label><input type="text" id="eSong"></div>
    </div>
    <div class="field"><label>Link de insights (opcional)</label><input type="text" id="eSInsights"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('editSongModalBg')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSongEdit()"><i class="ti ti-check"></i> Guardar</button>
    </div>
  </div>
</div>

<script>
let db=JSON.parse(localStorage.getItem('musicDB2')||'[]');
let favorites=JSON.parse(localStorage.getItem('musicFavorites')||'[]');
let currentView='weekly';
let pendingSongId=null,pendingWeekId=null;
let pendingSpotify=null,pendingTikTok=null;
const charts={};

function save(){localStorage.setItem('musicDB2',JSON.stringify(db))}
function saveFavs(){localStorage.setItem('musicFavorites',JSON.stringify(favorites))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function fmtNum(n){if(!n&&n!==0)return'—';if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return Math.round(n/1000)+'k';return n.toString()}
function isFav(id){return favorites.includes(id)}

function getWeekLabel(dateStr){
  const d=new Date(dateStr);
  const jan1=new Date(d.getFullYear(),0,1);
  const week=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return`Semana ${week} · ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function getCurrentWeekLabel(){return getWeekLabel(new Date().toISOString().slice(0,10));}
function getMondayOf(date){
  const d=new Date(date);const day=d.getDay();const diff=day===0?-6:1-day;
  d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d;
}
function archiveOldWeeks(){
  const nowMonday=getMondayOf(new Date());let changed=false;
  db.forEach(song=>{(song.weeks||[]).forEach(w=>{
    if(!w.archived&&w.date){const wMonday=getMondayOf(new Date(w.date));if(wMonday<nowMonday){w.archived=true;changed=true;}}
  });});
  if(changed)save();
}
function autoWeek(val,hiddenId,labelId){
  if(!val)return;const label=getWeekLabel(val);
  document.getElementById(hiddenId).value=label;
  document.getElementById(labelId).textContent=`→ ${label}`;
}

function handleSpotifyCSV(input){
  const file=input.files[0];if(!file)return;
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>{
    const data=r.data.map(row=>({date:row['Date']||row['date']||'',streams:parseInt(row['Spotify']||row['spotify']||0)||0})).filter(d=>d.date&&d.streams>0);
    data.sort((a,b)=>new Date(a.date)-new Date(b.date));pendingSpotify=data;
    const total=data.reduce((s,d)=>s+d.streams,0),avg=Math.round(total/data.length);
    const st=document.getElementById('wSpotifyCSVStatus');st.style.display='block';st.textContent=`✓ ${data.length} días · ${fmtNum(total)} streams · Media: ${fmtNum(avg)}/día`;
  }});
}
function handleTikTokCSV(input){
  const file=input.files[0];if(!file)return;
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>{
    const rows=r.data;let result;
    if(rows.length>1&&(rows[0]['Date']||rows[0]['date'])){
      result={daily:rows.map(row=>({date:row['Date']||row['date']||'',creations:parseInt(row['Creations']||row['creations']||0)||0,views:parseInt(row['Views']||row['views']||0)||0})).filter(d=>d.date).sort((a,b)=>new Date(a.date)-new Date(b.date)),creations:rows.reduce((s,r)=>s+(parseInt(r['Creations']||r['creations']||0)||0),0),views:rows.reduce((s,r)=>s+(parseInt(r['Views']||r['views']||0)||0),0),favorites:rows.reduce((s,r)=>s+(parseInt(r['Favorites']||r['favorites']||0)||0),0),shares:rows.reduce((s,r)=>s+(parseInt(r['Shares']||r['shares']||0)||0),0),likes:rows.reduce((s,r)=>s+(parseInt(r['Likes']||r['likes']||0)||0),0),comments:rows.reduce((s,r)=>s+(parseInt(r['Comments']||r['comments']||0)||0),0),period:''};
    } else {
      const row=rows[0]||{};result={daily:null,views:parseInt(row['Views']||row['views']||0)||0,creations:parseInt(row['Creations']||row['creations']||0)||0,favorites:parseInt(row['Favorites']||row['favorites']||0)||0,shares:parseInt(row['Shares']||row['shares']||0)||0,likes:parseInt(row['Likes']||row['likes']||0)||0,comments:parseInt(row['Comments']||row['comments']||0)||0,period:row['Time Period']||row['time period']||''};
    }
    pendingTikTok=result;const st=document.getElementById('wTikTokCSVStatus');st.style.display='block';st.textContent=`✓ ${fmtNum(result.creations)} creaciones · ${fmtNum(result.views)} views`;
  }});
}

async function fetchCover(artist,song){
  const key=`cover_${artist}_${song}`,cached=sessionStorage.getItem(key);if(cached)return cached;
  try{const r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist+' '+song)}&media=music&limit=1`);const d=await r.json();const url=d.results?.[0]?.artworkUrl100?.replace('100x100','300x300')||'';sessionStorage.setItem(key,url);return url;}catch{return''}
}

function renderChart(canvasId,labels,values,color){
  if(charts[canvasId])charts[canvasId].destroy();
  const ctx=document.getElementById(canvasId)?.getContext('2d');if(!ctx)return;
  charts[canvasId]=new Chart(ctx,{type:'line',data:{labels,datasets:[{data:values,borderColor:color,backgroundColor:color+'22',fill:true,tension:.3,pointRadius:2,pointHoverRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fmtNum(c.raw)}}},scales:{x:{ticks:{font:{size:10},maxTicksLimit:7},grid:{display:false}},y:{ticks:{font:{size:10},callback:v=>fmtNum(v)},grid:{color:'#e2e0d833'}}}}});
}

function videosGrid(videos){
  if(!videos||!videos.length)return'';
  return`<div class="videos-grid">${videos.map(v=>{const m=v.match(/tiktok\.com\/@([^/]+)\/(video|photo)\/(\d+)/);return m?`<div class="video-thumb"><iframe src="https://www.tiktok.com/embed/v2/${m[3]}" allowfullscreen scrolling="no" allow="encrypted-media;autoplay"></iframe><a href="${v}" target="_blank" style="position:absolute;inset:0"><div class="video-overlay"><i class="ti ti-external-link"></i></div></a></div>`:`<a href="${v}" target="_blank" style="border:0.5px solid var(--border);border-radius:8px;padding:.5rem;font-size:12px;color:var(--c1);display:flex;align-items:center;gap:6px"><i class="ti ti-external-link"></i>${v.slice(0,40)}...</a>`;}).join('')}</div>`;
}

function starBtn(songId){
  const fav=isFav(songId);
  return`<button class="star-btn${fav?' fav':''}" data-id="${songId}" title="${fav?'Quitar de favoritos':'Añadir a favoritos'}" onclick="event.stopPropagation();toggleFav('${songId}')"><i class="ti ti-star"></i></button>`;
}
function toggleFav(id){
  if(isFav(id)){favorites=favorites.filter(f=>f!==id);}else{favorites.push(id);}
  saveFavs();
  document.querySelectorAll(`.star-btn[data-id="${id}"]`).forEach(btn=>{btn.classList.toggle('fav',isFav(id));btn.title=isFav(id)?'Quitar de favoritos':'Añadir a favoritos';});
  if(currentView==='favorites')renderFavorites();
  showToast(isFav(id)?'Añadido a Favoritos':'Eliminado de Favoritos');
}

function renderSongCard(song){

  const covId=`cover-${song.id}`;
  const tags=(latest.tags||[]).filter(Boolean);
  const videos=(latest.videos||[]).filter(Boolean);
  const hasSpotify=latest.spotifyData&&latest.spotifyData.length>0;
  const hasTikTok=latest.tiktokData&&(latest.tiktokData.creations>0||latest.tiktokData.views>0);

  const spotChartId=`schart-${song.id}`,tikChartId=`tchart-${song.id}`;
  let spotTotal=0,spotAvg=0,spotMax=0;

    const url=await fetchCover(song.artist,song.song);const el=document.getElementById(covId);

    if(hasSpotify){const labels=latest.spotifyData.map(d=>{const dt=new Date(d.date);return`${dt.getDate()}/${dt.getMonth()+1}`;});renderChart(spotChartId,labels,latest.spotifyData.map(d=>d.streams),'#1DB954');}
    if(hasTikDaily){const labels=latest.tiktokData.daily.map(d=>{const dt=new Date(d.date);return`${dt.getDate()}/${dt.getMonth()+1}`;});renderChart(tikChartId,labels,latest.tiktokData.daily.map(d=>d.creations),'#ff0050');}
  },0);
  return`
  <div class="song-card" id="card-${song.id}">
    <div class="song-card-header" onclick="toggleCard('body-${song.id}')">
      <div class="song-title-area">
        <div class="song-avatar" id="${covId}">🎵</div>
        <div class="song-meta">
          <div class="song-name">${song.song}</div>
          <div class="song-artist"><span>${song.artist}</span>${song.insights?`<a href="${song.insights}" target="_blank" style="font-size:11px;color:var(--c1);display:inline-flex;align-items:center;gap:3px;text-decoration:none" onclick="event.stopPropagation()"><i class="ti ti-external-link" style="font-size:11px"></i>Insights</a>`:''}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${starBtn(song.id)}
        <span class="tag tag-week"><i class="ti ti-calendar" style="font-size:11px"></i>${latest.week||'—'}</span>
        <button class="btn btn-new-week" onclick="event.stopPropagation();showWeekModal('${song.id}',null)"><i class="ti ti-plus"></i> Nueva semana</button>
        <button class="btn" style="padding:5px 10px;font-size:12px;color:var(--c2d);background:var(--c2l);border-color:var(--c2l)" onclick="event.stopPropagation();shareWeek('${song.id}','${latest.id}')"><i class="ti ti-share"></i> Compartir</button>
        <button class="btn" style="padding:5px 10px;font-size:12px" onclick="event.stopPropagation();showSongEditModal('${song.id}')"><i class="ti ti-edit"></i></button>
        <button class="btn" style="padding:5px 10px;font-size:12px;color:var(--danger)" onclick="event.stopPropagation();deleteSong('${song.id}')"><i class="ti ti-trash"></i></button>
        <i class="ti ti-chevron-down" id="chevron-${song.id}" style="font-size:16px;color:var(--muted);transition:transform .2s"></i>
      </div>
    </div>
    <div class="song-card-body hidden" id="body-${song.id}">
      <div>
        <div class="section-label"><i class="ti ti-flame" style="font-size:14px;color:#BA7517"></i> Tendencia</div>
        <div class="trend-box">${latest.trend||'—'}${tags.length?`<div class="trend-tags">${tags.map(t=>`<span class="tag tag-trend">${t.trim()}</span>`).join('')}</div>`:''}</div>
      </div>
      <div class="data-section">
        <div>
          <div class="section-label"><span class="stat-dot spotify-dot"></span> Spotify</div>
          ${hasSpotify?`<div class="stats-row"><div class="stat-pill"><div class="stat-pill-val" style="color:#1DB954">${fmtNum(spotTotal)}</div><div class="stat-pill-label">Past 28 days</div></div><div class="stat-pill"><div class="stat-pill-val" style="color:#1DB954">${fmtNum(spotAvg)}</div><div class="stat-pill-label">Media/día</div></div><div class="stat-pill"><div class="stat-pill-val" style="color:#1DB954">${fmtNum(spotMax)}</div><div class="stat-pill-label">Pico</div></div></div><div class="chart-wrap"><div style="height:130px"><canvas id="${spotChartId}"></canvas></div></div>`:`<div class="no-data"><i class="ti ti-upload" style="display:block;font-size:22px;margin-bottom:.35rem"></i>Sube el CSV al añadir semana</div>`}
        </div>
        <div>
          <div class="section-label"><span class="stat-dot tiktok-dot"></span> TikTok${hasTikTok&&latest.tiktokData.period?` <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:10px">${latest.tiktokData.period}</span>`:''}</div>
          ${hasTikTok?`<div class="tiktok-grid"><div class="tik-stat tik-stat-main"><i class="ti ti-plus tik-stat-icon"></i><div><div class="tik-stat-val">${fmtNum(latest.tiktokData.creations)}</div><div class="tik-stat-label">creaciones</div></div></div><div class="tik-stat"><i class="ti ti-eye tik-stat-icon"></i><div><div class="tik-stat-val">${fmtNum(latest.tiktokData.views)}</div><div class="tik-stat-label">views</div></div></div><div class="tik-stat"><i class="ti ti-heart tik-stat-icon"></i><div><div class="tik-stat-val">${fmtNum(latest.tiktokData.likes)}</div><div class="tik-stat-label">likes</div></div></div><div class="tik-stat"><i class="ti ti-share tik-stat-icon"></i><div><div class="tik-stat-val">${fmtNum(latest.tiktokData.shares)}</div><div class="tik-stat-label">shares</div></div></div><div class="tik-stat"><i class="ti ti-bookmark tik-stat-icon"></i><div><div class="tik-stat-val">${fmtNum(latest.tiktokData.favorites)}</div><div class="tik-stat-label">favoritos</div></div></div><div class="tik-stat"><i class="ti ti-message tik-stat-icon"></i><div><div class="tik-stat-val">${fmtNum(latest.tiktokData.comments)}</div><div class="tik-stat-label">comentarios</div></div></div></div>${hasTikDaily?`<div class="chart-wrap"><div style="height:130px"><canvas id="${tikChartId}"></canvas></div></div>`:''}`:`<div class="no-data"><i class="ti ti-upload" style="display:block;font-size:22px;margin-bottom:.35rem"></i>Sube el CSV al añadir semana</div>`}
        </div>
      </div>
      <div>
        <div class="section-label"><i class="ti ti-brand-tiktok" style="font-size:14px;color:#ff0050"></i> Ejemplos</div>

        ${older.map(w=>{const wv=(w.videos||[]).filter(Boolean);return`<div class="week-accordion" style="margin-top:.75rem"><div class="week-accordion-header" onclick="toggleAccordion(this)"><span><i class="ti ti-history" style="margin-right:6px;font-size:12px"></i>${w.week||'Semana anterior'}</span><div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;font-weight:400">${wv.length} vídeo${wv.length!==1?'s':''}</span><i class="ti ti-chevron-down chevron"></i></div></div><div class="week-accordion-body">${w.trend?`<div style="font-size:12px;color:var(--muted);margin-bottom:.75rem;line-height:1.5"><span style="font-weight:500;color:#1a1a18">Tendencia:</span> ${w.trend}</div>`:''}<div style="display:flex;justify-content:flex-end;margin-bottom:.5rem"><button class="btn" style="font-size:11px;padding:3px 8px" onclick="showWeekModal('${song.id}','${w.id}')"><i class="ti ti-edit" style="font-size:11px"></i> Editar semana</button></div>${wv.length?videosGrid(wv):'<div class="no-data">Sin vídeos</div>'}</div></div>`;}).join('')}
      </div>
    </div>
  </div>`;
}

function toggleCard(bodyId){
  const body=document.getElementById(bodyId);const songId=bodyId.replace('body-','');const chevron=document.getElementById('chevron-'+songId);
  const isOpen=!body.classList.contains('hidden');body.classList.toggle('hidden');
  if(chevron)chevron.style.transform=isOpen?'':'rotate(180deg)';
}
function toggleAccordion(header){header.classList.toggle('open');header.nextElementSibling.classList.toggle('open');}

function shareWeek(songId,weekId){
  const song=db.find(s=>s.id===songId);if(!song)return;const week=song.weeks.find(w=>w.id===weekId);if(!week)return;
  const payload={song:song.song,artist:song.artist,insights:song.insights,...week};
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const shareUrl=`${location.href.split('#')[0]}#share=${encoded}`;
  navigator.clipboard.writeText(shareUrl).then(()=>showToast('Enlace copiado al portapapeles')).catch(()=>prompt('Copia este enlace:',shareUrl));
}
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.opacity='0',2500);
}

function renderWeekly(){
  const currentWeek=getCurrentWeekLabel();
  document.getElementById('weekLabel').textContent=currentWeek;
  const active=db.filter(s=>(s.weeks||[]).some(w=>!w.archived&&w.week===currentWeek));
  const container=document.getElementById('songCards'),empty=document.getElementById('emptyState');
  if(!active.length){container.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');
  container.innerHTML=active.map(s=>{
    const weekSong={...s,weeks:s.weeks.filter(w=>!w.archived&&w.week===currentWeek)};
    return renderSongCard(weekSong);
  }).join('');
}

function renderSidebar(){
  const q=(document.getElementById('sidebarSearch').value||'').toLowerCase();
  let html='';
  db.filter(s=>!q||s.artist.toLowerCase().includes(q)||s.song.toLowerCase().includes(q))
    .forEach(s=>{
      html+=`<span class="song-link" onclick="jumpTo('${s.id}')"><span class="song-link-artist">${s.artist}</span><span class="song-link-sep">·</span>${s.song}</span>`;
    });

function jumpTo(id){
  switchView('weekly',document.querySelector('.nav-tab'));
  setTimeout(()=>{document.getElementById('card-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});},120);
}

function renderHistory(){
  const q=(document.getElementById('histSearch').value||'').toLowerCase();
  const fA=document.getElementById('filterArtist').value,fW=document.getElementById('filterWeek').value;
  let rows=[];
  db.forEach(s=>{(s.weeks||[]).filter(w=>w.archived).forEach(w=>{rows.push({...w,artist:s.artist,song:s.song,songId:s.id});});});
  if(q)rows=rows.filter(r=>r.artist.toLowerCase().includes(q)||r.song.toLowerCase().includes(q)||(r.trend||'').toLowerCase().includes(q)||(r.tags||[]).join(' ').toLowerCase().includes(q));
  if(fA)rows=rows.filter(r=>r.artist===fA);
  if(fW)rows=rows.filter(r=>r.week===fW);
  rows.sort((a,b)=>b.week.localeCompare(a.week));
  let html='';
  if(!rows.length)html='<div class="empty"><i class="ti ti-search-off"></i><p>No hay resultados en el histórico</p></div>';
  else html=rows.map(r=>`
    <div class="history-row">
      <div class="history-week-dot">${(r.week||'').replace(/[^0-9]/g,'').slice(0,2)||'–'}</div>
      <div>
        <div style="font-size:13px;font-weight:500">${r.artist} — ${r.song}</div>
        <div class="history-meta">${r.week||'—'}</div>
        <div class="history-trend">${r.trend||'—'}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn" style="font-size:12px;padding:5px 10px" onclick="showWeekModal('${r.songId}','${r.id}')"><i class="ti ti-edit"></i></button>
        <button class="btn" style="font-size:12px;padding:5px 10px;color:var(--danger)" onclick="deleteWeek('${r.songId}','${r.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('');
  document.getElementById('historyContent').innerHTML=html;
}

function deleteWeek(songId,weekId){
  if(!confirm('¿Eliminar esta entrada del histórico?'))return;
  const s=db.find(x=>x.id===songId);if(!s)return;
  s.weeks=s.weeks.filter(w=>w.id!==weekId);save();renderHistory();
}

function populateHistoryFilters(){
  const archivedRows=[];db.forEach(s=>(s.weeks||[]).filter(w=>w.archived).forEach(w=>archivedRows.push({...w,artist:s.artist})));
  const artists=[...new Set(archivedRows.map(r=>r.artist))].sort();
  const weeks=[...new Set(archivedRows.map(r=>r.week))].sort().reverse();
  const fa=document.getElementById('filterArtist'),fw=document.getElementById('filterWeek');
  const as=fa.value,ws=fw.value;
  fa.innerHTML='<option value="">Todos los artistas</option>'+artists.map(a=>`<option>${a}</option>`).join('');
  fw.innerHTML='<option value="">Todas las semanas</option>'+weeks.map(w=>`<option>${w}</option>`).join('');
  fa.value=as;fw.value=ws;
}

  const container=document.getElementById('favoritesContent');
  const favSongs=db.filter(s=>isFav(s.id));
  if(!favSongs.length){container.innerHTML=`<div class="favs-empty"><i class="ti ti-star"></i><p style="font-weight:500;margin-bottom:.35rem">Sin favoritos aún</p><p style="font-size:13px">Pulsa la estrella en cualquier canción para guardarla aquí.</p></div>`;return;}
  container.innerHTML=favSongs.map(song=>{
    const latest=[...song.weeks].sort((a,b)=>b.week.localeCompare(a.week))[0];
    const covId=`fav-cover-${song.id}`;
    setTimeout(async()=>{const url=await fetchCover(song.artist,song.song);const el=document.getElementById(covId);if(el&&url)el.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" alt="">`;},0);
    return`<div class="fav-card"><div class="fav-avatar" id="${covId}">🎵</div><div><div style="font-size:14px;font-weight:500">${song.song}</div><div style="font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:8px"><span>${song.artist}</span>${latest?`<span class="tag tag-week" style="font-size:10px;padding:2px 6px"><i class="ti ti-calendar" style="font-size:10px"></i>${latest.week}</span>`:''} ${song.insights?`<a href="${song.insights}" target="_blank" style="font-size:11px;color:var(--c1);display:inline-flex;align-items:center;gap:3px;text-decoration:none"><i class="ti ti-external-link" style="font-size:11px"></i>Insights</a>`:''}</div>${latest&&latest.trend?`<div style="font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px">${latest.trend}</div>`:''}</div><div style="display:flex;align-items:center;gap:6px"><button class="btn" style="font-size:12px;padding:5px 10px" onclick="jumpTo('${song.id}')"><i class="ti ti-arrow-right"></i> Ver</button><button class="fav-remove" title="Quitar de favoritos" onclick="toggleFav('${song.id}')"><i class="ti ti-star"></i></button></div></div>`;
  }).join('');
}

function switchView(view,el){
  currentView=view;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.getElementById('weeklyView').classList.toggle('hidden',view!=='weekly');
  document.getElementById('historyView').classList.toggle('hidden',view!=='history');

}

function showAddModal(){document.getElementById('fArtist').value='';document.getElementById('fSong').value='';document.getElementById('fInsights').value='';document.getElementById('modalBg').classList.remove('hidden');}

function saveSong(){
  const artist=document.getElementById('fArtist').value.trim();const song=document.getElementById('fSong').value.trim();

function showSongEditModal(songId){

function saveSongEdit(){

function showWeekModal(songId,weekId){
  pendingSongId=songId;pendingWeekId=weekId;pendingSpotify=null;pendingTikTok=null;
  const s=db.find(x=>x.id===songId);if(!s)return;
  document.getElementById('weekModalSongRef').textContent=`${s.song} — ${s.artist}`;
  const w=weekId?s.weeks.find(x=>x.id===weekId):null;

  document.getElementById('wDate').value=w?.date||'';document.getElementById('wWeek').value=w?.week||'';

  document.getElementById('wTrend').value=w?.trend||'';document.getElementById('wTags').value=(w?.tags||[]).join(', ');
  document.getElementById('wSpotifyCSV').value='';document.getElementById('wTikTokCSV').value='';

  if(w?.tiktokData?.creations){ts.style.display='block';ts.textContent=`✓ ${fmtNum(w.tiktokData.creations)} creaciones cargadas`;}else ts.style.display='none';
  document.getElementById('wUrlList').innerHTML='';(w?.videos||['']).forEach(v=>addUrlField('wUrlList',v));
  document.getElementById('weekModalBg').classList.remove('hidden');

function saveWeek(){
  const week=document.getElementById('wWeek').value.trim();if(!week){alert('Selecciona una fecha para calcular la semana');return;}
  const s=db.find(x=>x.id===pendingSongId);if(!s)return;
  const existing=pendingWeekId?s.weeks.find(w=>w.id===pendingWeekId):null;
  const currentWeek=getCurrentWeekLabel();
  const isArchived=existing?existing.archived:(week!==currentWeek);
  const entry={id:pendingWeekId||uid(),date:document.getElementById('wDate').value,week,archived:isArchived,trend:document.getElementById('wTrend').value.trim(),tags:document.getElementById('wTags').value.split(',').map(t=>t.trim()).filter(Boolean),spotifyData:pendingSpotify!==null?pendingSpotify:(existing?.spotifyData||null),tiktokData:pendingTikTok!==null?pendingTikTok:(existing?.tiktokData||null),videos:[...document.querySelectorAll('#wUrlList input')].map(i=>i.value.trim()).filter(Boolean)};
  if(pendingWeekId)s.weeks=s.weeks.map(w=>w.id===pendingWeekId?entry:w);else s.weeks.push(entry);
  save();closeModal('weekModalBg');renderAll();
}

function deleteSong(id){
  if(!confirm('¿Eliminar esta canción y todas sus semanas?'))return;
  db=db.filter(s=>s.id!==id);favorites=favorites.filter(f=>f!==id);save();saveFavs();renderAll();
}

function addUrlField(listId,val=''){
  const row=document.createElement('div');row.className='url-row';
  row.innerHTML=`<input type="text" placeholder="https://www.tiktok.com/@..." value="${val}"><button onclick="this.parentElement.remove()"><i class="ti ti-x" style="font-size:13px"></i></button>`;
  document.getElementById(listId).appendChild(row);
}

function closeModal(id){document.getElementById(id).classList.add('hidden')}
function closeModalOutside(e){if(e.target.classList.contains('modal-bg'))e.target.classList.add('hidden')}
function renderAll(){renderWeekly();renderSidebar();if(currentView==='history'){populateHistoryFilters();renderHistory();}if(currentView==='favorites'){renderFavorites();}}

if(!db.length){
  const today=new Date().toISOString().slice(0,10);const currentWeek=getCurrentWeekLabel();
  db=[{id:uid(),artist:'Cano',song:'Así Nací y Así Moriré',insights:'https://insights.sonymusic.com/song/ES5022600132/tiktok?country=ES',weeks:[{id:uid(),date:today,week:currentWeek,archived:false,trend:'Fotos con tu pareja con la letra "Siendo tú mi lugar favorito, tengo más de lo que necesito" y copys románticos en general.',tags:['carrusel fotos','ugc','pareja','romántico'],spotifyData:null,tiktokData:null,videos:['https://www.tiktok.com/@brunoflorenciano/photo/7636402153451506947','https://www.tiktok.com/@087008i/photo/7638408042626764054','https://www.tiktok.com/@55grccc/photo/7636706227657116930','https://www.tiktok.com/@marinaglvz02/photo/7637650040839818518']}]}];
  save();
}

archiveOldWeeks();
renderAll();
</script>
